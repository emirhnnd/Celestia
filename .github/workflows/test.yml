# Her gönderimde testleri çalıştırır: dört mesafe ölçeğinde senaryolar + savunma testleri.
# Beş tur ayrı işlerde, yan yana çalışır; biri kalırsa diğerleri yine tamamlanır.
# Kalan turun ekran görüntüleri "Artifacts" altına yüklenir.
name: Testler

on:
  push:
  workflow_dispatch:

# aynı dala art arda gönderim yapılırsa eski çalışmayı iptal et
concurrency:
  group: testler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.ad }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tur: '1', ad: 'Senaryolar · Kompakt' }
          - { tur: '2.5', ad: 'Senaryolar · Geniş' }
          - { tur: '6', ad: 'Senaryolar · Gerçekçiye yakın' }
          - { tur: 'R', ad: 'Senaryolar · Gerçek ölçek' }
          - { tur: 'savunma', ad: 'Savunma testleri' }
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bağımlılıkları kur
        run: npm install
      - name: Tarayıcıyı kur
        run: npx playwright install --with-deps chromium
      - name: Testleri çalıştır
        run: node tum.js ${{ matrix.tur }}
      - name: Ekran görüntülerini yükle (kalırsa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri-${{ matrix.tur }}
          path: test/shots
          if-no-files-found: ignore
